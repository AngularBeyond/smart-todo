name: Deploy

on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - web
          - api

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  filter:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filter
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          filters: |
            api:
              - 'smart-todo-api/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'
            web:
              - 'smart-todo/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/deploy.yml'

  deploy-api:
    name: Deploy Backend API
    needs: filter
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'api')) ||
      (github.event_name == 'push' && needs.filter.outputs.api == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --prefix smart-todo-api install --frozen-lockfile

      - name: Run Prisma Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --prefix smart-todo-api exec prisma migrate deploy

      - name: Checkout Deployment Tools
        uses: actions/checkout@v4
        with:
          repository: AngularBeyond/smart-todo-infra
          token: ${{ secrets.INFRA_REPO_ACCESS_TOKEN || github.token }}
          path: infra

      - name: Deploy API to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
        run: node infra/scripts/deploy-hostinger.mjs api

  deploy-web:
    name: Deploy Frontend Web
    needs: filter
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'web')) ||
      (github.event_name == 'push' && needs.filter.outputs.web == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --prefix smart-todo install --frozen-lockfile

      - name: Build Angular Frontend
        run: pnpm web:build

      - name: Checkout Deployment Tools
        uses: actions/checkout@v4
        with:
          repository: AngularBeyond/smart-todo-infra
          token: ${{ secrets.INFRA_REPO_ACCESS_TOKEN || github.token }}
          path: infra

      - name: Deploy Frontend to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
        run: node infra/scripts/deploy-hostinger.mjs web
