<aside class="hidden min-h-[calc(100vh-4rem)] w-72 shrink-0 flex-col border-r border-border bg-sidebar px-5 py-7 md:flex">
  <div class="mb-8 flex items-center">
    <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-muted-foreground">Your space</span>
  </div>

  <nav class="flex flex-col gap-1">
    <a
      routerLink="/"
      routerLinkActive="bg-secondary text-secondary-foreground font-medium"
      [routerLinkActiveOptions]="{ exact: true }"
      hlmBtn
      variant="secondary"
      class="justify-start gap-3 font-medium"
    >
      <svg lucideInbox class="size-4"></svg>
      <span>All tasks</span>
      <span hlmBadge variant="outline" class="ml-auto">14</span>
    </a>
    <button hlmBtn variant="ghost" class="justify-start gap-3 text-muted-foreground">
      <svg lucideStar class="size-4"></svg>
      <span>Starred</span>
    </button>
    <button hlmBtn variant="ghost" class="justify-start gap-3 text-muted-foreground">
      <svg lucideArchive class="size-4"></svg>
      <span>Archive</span>
    </button>
  </nav>

  <div class="mt-10 flex items-center justify-between">
    <span class="font-mono text-[10px] uppercase tracking-[0.2em] text-muted-foreground">
      Lists <span class="text-primary">{{ lists().length }}/3</span>
    </span>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="size-7"
      (click)="newListInput.focus()"
    >
      <svg lucideListPlus class="size-4"></svg>
    </button>
  </div>

  <div class="mt-3 flex flex-col gap-1">
    @for (list of lists(); track list.name) {
      <button
        type="button"
        (click)="selectList(list.name)"
        class="group flex items-center gap-3 rounded-md px-3 py-2.5 text-left text-sm transition-colors"
        [class.bg-sidebar-accent]="activeList() === list.name"
        [class.font-medium]="activeList() === list.name"
        [class.text-sidebar-accent-foreground]="activeList() === list.name"
        [class.text-muted-foreground]="activeList() !== list.name"
      >
        <span class="size-2 rounded-full" [class]="list.color"></span>
        <span class="truncate">{{ list.name }}</span>
        @if (list.starred) {
          <svg lucideStar class="ml-auto size-3.5 fill-current text-primary"></svg>
        }
      </button>
    }
  </div>

  <div class="mt-8 border-t border-sidebar-border pt-4">
    <div class="flex items-center justify-between text-xs text-muted-foreground">
      <span>New list</span>
      <span>{{ lists().length }}/3 used</span>
    </div>
    <div class="mt-2 flex gap-2">
      <input
        #newListInput
        hlmInput
        [ngModel]="newList()"
        (ngModelChange)="newList.set($event)"
        [disabled]="lists().length >= 3"
        (keydown.enter)="createList()"
        placeholder="Name your list"
        class="h-9 bg-background text-xs"
      />
      <button
        hlmBtn
        size="icon"
        class="size-9 shrink-0"
        (click)="createList()"
        [disabled]="lists().length >= 3 || !newList().trim()"
      >
        <svg lucidePlus class="size-4"></svg>
      </button>
    </div>
  </div>

  <div class="mt-auto pt-4">
    <div hlmSeparator class="mb-3"></div>
    <a
      routerLink="/tags"
      routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-medium"
      hlmBtn
      variant="ghost"
      class="w-full justify-start gap-3 px-3 text-muted-foreground hover:text-foreground"
    >
      <svg lucideTag class="size-4"></svg>
      <span>Tags</span>
    </a>
    <a
      routerLink="/settings"
      routerLinkActive="bg-sidebar-accent text-sidebar-accent-foreground font-medium"
      hlmBtn
      variant="ghost"
      class="w-full justify-start gap-3 px-3 text-muted-foreground hover:text-foreground"
    >
      <svg lucideSettings2 class="size-4"></svg>
      <span>Settings</span>
    </a>
  </div>
</aside>
