<header class="flex h-16 items-center justify-between border-b border-border bg-card px-5 md:px-8">
  <div class="flex items-center gap-3">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="md:hidden size-9"
      aria-label="Open sidebar"
      (click)="toggleSidebar()"
    >
      <svg lucideMenu class="size-5"></svg>
    </button>

    <a routerLink="/" class="flex items-center gap-3 text-left">
      <div class="flex size-9 items-center justify-center bg-primary text-primary-foreground shadow-sm">
        <svg lucideSparkles class="size-4"></svg>
      </div>
      <div>
        <p class="font-mono text-[10px] uppercase tracking-[0.22em] text-muted-foreground">Smart Todo</p>
        <p class="text-xs text-foreground/70">Your tasks, orchestrated by agents.</p>
      </div>
    </a>
  </div>

  <div class="flex items-center gap-2">
    <button hlmBtn variant="ghost" size="icon" aria-label="Agentic assistant">
      <svg lucideBot class="size-4"></svg>
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      aria-label="Toggle theme"
      (click)="toggleTheme()"
    >
      @if (appStore.theme() === 'dark') {
        <svg lucideSun class="size-4"></svg>
      } @else {
        <svg lucideMoon class="size-4"></svg>
      }
    </button>
    <div hlmSeparator orientation="vertical" class="mx-2 h-6"></div>

    <!-- User Avatar Dropdown -->
    <div
      class="relative"
      (mouseenter)="onMouseEnter()"
      (mouseleave)="onMouseLeave()"
    >
      <button
        type="button"
        (click)="toggleDropdown()"
        class="flex size-8 items-center justify-center rounded-full bg-secondary font-mono text-xs font-semibold text-secondary-foreground transition-colors hover:bg-primary hover:text-primary-foreground focus:outline-none"
        aria-label="Open profile menu"
      >
        {{ appStore.userInitials() }}
      </button>

      @if (showDropdown()) {
        <div
          class="absolute right-0 top-full z-50 mt-2 w-56 rounded-md border border-border bg-popover p-1 shadow-md"
        >
          <div class="flex items-center gap-2 px-2 py-1.5">
            <div class="flex size-8 shrink-0 items-center justify-center rounded-full bg-secondary font-mono text-xs font-semibold text-secondary-foreground">
              {{ appStore.userInitials() }}
            </div>
            <div class="flex flex-col min-w-0">
              <span class="truncate text-sm font-medium text-popover-foreground">{{ appStore.userDisplayName() }}</span>
              <span class="truncate text-xs text-muted-foreground">{{ appStore.profile()?.email ?? '' }}</span>
            </div>
          </div>
          <div hlmSeparator class="my-1"></div>
          <a
            routerLink="/profile"
            (click)="closeDropdown()"
            hlmBtn
            variant="ghost"
            class="flex w-full justify-start gap-2 px-2 text-sm font-normal text-popover-foreground hover:bg-accent hover:text-accent-foreground"
          >
            <svg lucideUser class="size-4"></svg>
            <span>Profile</span>
          </a>
          <a
            routerLink="/settings"
            (click)="closeDropdown()"
            hlmBtn
            variant="ghost"
            class="flex w-full justify-start gap-2 px-2 text-sm font-normal text-popover-foreground hover:bg-accent hover:text-accent-foreground"
          >
            <svg lucideSettings2 class="size-4"></svg>
            <span>Settings</span>
          </a>
          <div hlmSeparator class="my-1"></div>
          <button
            type="button"
            hlmBtn
            variant="ghost"
            class="flex w-full justify-start gap-2 px-2 text-sm font-normal text-destructive hover:bg-destructive/10 hover:text-destructive"
            (click)="logout()"
          >
            <svg lucideLogOut class="size-4"></svg>
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</header>
