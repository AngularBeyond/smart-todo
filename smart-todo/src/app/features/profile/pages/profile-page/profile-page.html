<div class="mx-auto w-full max-w-5xl px-5 py-8 md:px-10 md:py-12">
  <a
    routerLink="/"
    class="mb-8 inline-flex items-center gap-2 text-xs font-medium text-muted-foreground transition-colors hover:text-foreground"
  >
    <svg lucideArrowLeft class="size-4"></svg> Back to tasks
  </a>

  <!-- Header -->
  <div class="mb-9 flex flex-col justify-between gap-5 border-b border-border pb-8 sm:flex-row sm:items-end">
    <div>
      <p class="font-mono text-[10px] uppercase tracking-[0.22em] text-muted-foreground">Your account</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight md:text-4xl">Profile<span class="text-primary">.</span></h1>
      <p class="mt-2 text-sm text-muted-foreground">Keep your space personal and focused.</p>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex size-14 items-center justify-center rounded-full bg-secondary font-mono text-lg font-semibold text-secondary-foreground shadow-sm">
        {{ store.initials() }}
      </div>
      <div>
        <p class="font-medium text-foreground">{{ store.fullName() || 'Your Name' }}</p>
        <p class="text-xs text-muted-foreground">{{ store.email() }}</p>
      </div>
    </div>
  </div>

  <div class="grid gap-6 lg:grid-cols-[1.1fr_0.9fr]">
    <!-- Personal Details Form Component -->
    <app-profile-form
      [profile]="store.profile()"
      [currentTheme]="appStore.theme()"
      [isLoading]="store.isPending()"
      [error]="store.error()"
      [success]="store.profileSuccess()"
      (save)="store.updateProfile($event)"
      (themeChange)="onThemeChange($event)"
      (clearStatus)="store.clearStatus()"
    />

    <!-- Change Password Form Component -->
    <app-change-password-form
      [isLoading]="store.isPending()"
      [error]="store.error()"
      [success]="store.passwordSuccess()"
      (changePassword)="store.changePassword($event)"
      (clearStatus)="store.clearStatus()"
    />
  </div>
</div>
