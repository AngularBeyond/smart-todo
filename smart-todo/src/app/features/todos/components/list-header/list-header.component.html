<div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-center sm:gap-4">
  <!-- Left Side: Title (inline editing or display) and Active Count Chip -->
  <div class="flex flex-wrap items-center gap-3">
    @if (isEditingTitle()) {
      <label for="edit-list-title-input" class="sr-only">Edit list title</label>
      <input
        id="edit-list-title-input"
        hlmInput
        appAutoFocus
        [appAutoFocusSelect]="true"
        type="text"
        [ngModel]="editingTitle()"
        (ngModelChange)="editingTitle.set($event)"
        (keydown)="onTitleKeyDown($event)"
        (blur)="saveTitle()"
        maxlength="100"
        aria-label="Edit list title"
        class="h-10 w-64 text-2xl font-semibold sm:w-80 md:text-3xl"
      />
    } @else {
      <div class="group flex items-center gap-2">
        <h1 class="text-3xl font-semibold tracking-tight md:text-4xl">
          <button
            type="button"
            (click)="startEditing()"
            [attr.aria-label]="'Edit list title: ' + list().name"
            class="cursor-pointer text-left hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          >
            {{ list().name }}
          </button>
        </h1>
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          (click)="startEditing()"
          [attr.aria-label]="'Edit list title ' + list().name"
          class="size-8 opacity-0 transition-opacity group-hover:opacity-100 hover:text-primary"
        >
          <svg lucidePencil class="size-4"></svg>
        </button>
      </div>
    }

    <span hlmBadge variant="outline" class="font-mono text-[10px] uppercase tracking-wider">
      {{ list().activeCount }} active
    </span>

    <!-- Actions Cluster: [Star] [Search] [Waste Basket] -->
    <div class="flex items-center gap-0.5">
      <!-- 1. Star Button -->
      <button
        hlmBtn
        variant="ghost"
        size="icon"
        type="button"
        (click)="toggleStar.emit()"
        [attr.aria-label]="list().isStarred ? 'Unstar list' : 'Star list'"
        class="size-8"
        [class.text-amber-500]="list().isStarred"
        [class.hover:text-amber-600]="list().isStarred"
        [class.text-muted-foreground]="!list().isStarred"
      >
        <svg
          lucideStar
          class="size-4"
          [class.fill-current]="list().isStarred"
        ></svg>
      </button>

      <!-- 2. Search Button -->
      <button
        hlmBtn
        variant="ghost"
        size="icon"
        type="button"
        (click)="toggleSearch.emit()"
        aria-label="Toggle search filter"
        class="size-8 text-muted-foreground hover:text-foreground"
        [class.text-primary]="isSearchOpen()"
        [class.bg-accent]="isSearchOpen()"
      >
        <svg lucideSearch class="size-4"></svg>
      </button>

      <!-- 3. Delete / Waste Basket Button -->
      <hlm-alert-dialog>
        <button
          hlmAlertDialogTrigger
          hlmBtn
          variant="ghost"
          size="icon"
          type="button"
          aria-label="Delete list"
          class="size-8 text-muted-foreground hover:text-destructive"
        >
          <svg lucideTrash class="size-4"></svg>
        </button>

        <hlm-alert-dialog-content *hlmAlertDialogPortal="let ctx">
          <hlm-alert-dialog-header>
            <h2 hlmAlertDialogTitle>Delete "{{ list().name }}"?</h2>
            <p hlmAlertDialogDescription>
              This action cannot be undone. This will permanently delete this todo list and all of its tasks.
            </p>
          </hlm-alert-dialog-header>
          <hlm-alert-dialog-footer>
            <button hlmAlertDialogCancel hlmBtn variant="outline">Cancel</button>
            <button
              hlmAlertDialogAction
              hlmBtn
              variant="destructive"
              (click)="deleteList.emit(); ctx.close()"
            >
              Delete List
            </button>
          </hlm-alert-dialog-footer>
        </hlm-alert-dialog-content>
      </hlm-alert-dialog>
    </div>
  </div>

  <!-- Right Side / Mobile: under H1 right-aligned -->
  <div class="flex w-full items-center justify-end shrink-0 sm:w-auto">
    <ng-content />
  </div>
</div>
