<div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
  <!-- Left Side: Title (inline editing or display) and Active Count Chip -->
  <div class="flex flex-wrap items-center gap-3">
    @if (isEditingTitle()) {
      <label for="edit-list-title-input" class="sr-only">Edit list title</label>
      <input
        id="edit-list-title-input"
        hlmInput
        appAutoFocus
        [appAutoFocusSelect]="true"
        type="text"
        [ngModel]="editingTitle()"
        (ngModelChange)="editingTitle.set($event)"
        (keydown)="onTitleKeyDown($event)"
        (blur)="saveTitle()"
        maxlength="100"
        aria-label="Edit list title"
        class="h-10 w-64 text-2xl font-semibold sm:w-80 md:text-3xl"
      />
    } @else {
      <div class="group flex items-center gap-2">
        <h1 class="text-3xl font-semibold tracking-tight md:text-4xl">
          <button
            type="button"
            (click)="startEditing()"
            [attr.aria-label]="'Edit list title: ' + list().name"
            class="cursor-pointer text-left hover:text-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          >
            {{ list().name }}
          </button>
        </h1>
        <button
          hlmBtn
          variant="ghost"
          size="icon"
          (click)="startEditing()"
          [attr.aria-label]="'Edit list title ' + list().name"
          class="size-8 opacity-0 transition-opacity group-hover:opacity-100 hover:text-primary"
        >
          <svg lucidePencil class="size-4"></svg>
        </button>
      </div>
    }

    <span hlmBadge variant="outline" class="font-mono text-[10px] uppercase tracking-wider">
      {{ list().activeCount }} active
    </span>
  </div>

  <!-- Right Side: Today's progress projection (aligned at the same height as H1) -->
  <div class="flex items-center gap-3 shrink-0">
    <ng-content />
  </div>
</div>
